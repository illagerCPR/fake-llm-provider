name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      # 版本从 package.json 的 packageManager 字段读，避免两处版本打架
      - uses: pnpm/action-setup@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 26
          cache: pnpm

      - name: 安装依赖
        run: pnpm install --frozen-lockfile

      - name: 类型检查（Node / Worker / 管理台）
        run: pnpm typecheck

      - name: 单元与集成测试
        run: pnpm test

      - name: 构建产物
        run: pnpm build

      - name: Worker 打包校验
        run: pnpm cf:dry

  docker:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: docker/setup-buildx-action@v3

      - name: 构建镜像（不推送）
        uses: docker/build-push-action@v6
        with:
          context: .
          push: false
          tags: fake-llm-provider:ci
          cache-from: type=gha
          cache-to: type=gha,mode=max
